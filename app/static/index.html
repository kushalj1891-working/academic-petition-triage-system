<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Academic Petition Triage</title><style>body{font:16px system-ui;max-width:920px;margin:32px auto;padding:0 18px;color:#17243a}h1{color:#183c72}textarea,input,select,button{font:inherit;padding:10px;margin:4px 0}textarea{width:100%;height:110px}button{background:#174a8b;color:white;border:0;border-radius:6px;cursor:pointer}.card{border:1px solid #ccd5e2;padding:18px;border-radius:10px;margin:16px 0}pre{white-space:pre-wrap;background:#f4f6f8;padding:12px}.note{color:#815b18}</style></head><body><h1>Academic Petition Triage</h1><p>Evidence-grounded decision support. Final decisions belong to the university examination officer.</p><div class="card"><form id="f"><label>Petition ID <input name="petition_id" value="SYN-001" required></label><label>Category <select name="petition_type"><option>attendance</option><option>re_evaluation</option><option>re_registration</option><option>medical_leave</option><option>grade_grievance</option></select></label><label>Reported attendance % <input name="attendance_percent" type="number" min="0" max="100" value="65"></label><label>Medical document available? <select name="medical_documented"><option value="false">No</option><option value="true">Yes</option></select></label><p><textarea name="text">My attendance is below the required minimum due to a documented medical condition. Please review the attendance shortage and condonation provision.</textarea></p><button>Submit petition</button></form></div><div id="result" class="card" hidden></div><script>const form=document.querySelector('#f'),out=document.querySelector('#result');form.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(form));d.attendance_percent=Number(d.attendance_percent);d.medical_documented=d.medical_documented==='true';let r=await fetch('/v1/runs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)});let a=await r.json();out.hidden=false;out.textContent='Queued: '+a.run_id;let timer=setInterval(async()=>{let s=await(await fetch(a.status_url)).json();if(s.status==='completed'||s.status==='needs_human'||s.status==='failed'){clearInterval(timer);out.innerHTML='<h2>'+s.status+' · '+(s.result?.route||'')+'</h2><p>'+ (s.result?.rationale||'')+'</p><p class="note">Decision support only. The examination officer makes the final decision.</p><h3>Citations</h3><pre>'+JSON.stringify(s.result?.citations||[],null,2)+'</pre><details><summary>Run details</summary><pre>'+JSON.stringify(s,null,2)+'</pre></details>'}},900)};</script></body></html>
