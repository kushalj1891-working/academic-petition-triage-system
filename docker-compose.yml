name: academic-petition-triage

services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      REDIS_URL: redis://redis:6379/0
      DB_PATH: /state/runs.db
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      PROMPT_VERSION: triage-v1
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      MODEL_NAME: ${MODEL_NAME:-}
    volumes: ["appdata:/state"]
    depends_on: {redis: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 20s, timeout: 5s, retries: 3}
  agent-worker:
    build: .
    command: python -m app.worker
    environment:
      REDIS_URL: redis://redis:6379/0
      DB_PATH: /state/runs.db
      PROMPT_VERSION: triage-v1
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      MODEL_NAME: ${MODEL_NAME:-}
    volumes: ["appdata:/state"]
    depends_on: {redis: {condition: service_healthy}}
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    depends_on: [api]
  grafana:
    image: grafana/grafana:11.4.0
    ports: ["3000:3000"]
    environment: [GF_AUTH_ANONYMOUS_ENABLED=true, GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer]
    volumes: ["./grafana/provisioning:/etc/grafana/provisioning:ro"]
    depends_on: [prometheus]
  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    ports: ["16686:16686", "4317:4317"]
volumes:
  appdata:
  redisdata:
